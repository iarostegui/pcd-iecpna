name: Validacion SDD PCD
on:
  push:
    branches: [main]
  pull_request:
jobs:
  documentos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
# Validación estática; NO acredita SQL/MariaDB ni backend implementado.
