openapi: 3.0.3
info:
  title: PCD IECPNA — API de captura
  version: 3.2.0
  description: "Contrato PCD V3.1 con propuestas E2; E1-D01 y E1-D02 pendientes; E2-D01/D02/D03 ratificados, sin migración SGSP."
servers:
  - url: https://pcd.unobdata.com/api/v1
tags:
  - name: auth
  - name: catalogos
  - name: personas
  - name: gc
  - name: admin
  - name: reportes
  - name: auditoria
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    PersonId:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    Idempotency:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, maxLength: 110 }
  schemas:

    PersonaResumen:
      type: object
      properties:
        persona_id: { type: integer, nullable: true, description: No revelar ID de coincidencia fuera del ámbito. }
        nombres: { type: string, nullable: true }
        documento_mascara: { type: string, nullable: true }
        fichas_visibles: { type: integer }
    FichaDetalle:
      type: object
      properties:
        ficha_id: { type: integer }
        tipo_ficha: { type: string, enum: [PERSONA, GC] }
        presbiterio_id: { type: integer }
        sede_id: { type: integer }
        created_by: { type: integer }
        version: { type: integer }
        datos_fuente: { type: object, additionalProperties: true }
        puede_editar: { type: boolean }
    PersonaDetalle:
      type: object
      properties:
        persona: { $ref: '#/components/schemas/PersonaResumen' }
        fichas: { type: array, items: { $ref: '#/components/schemas/FichaDetalle' } }
    PersonaGuardada:
      type: object
      required: [ficha_id, persona_reutilizada]
      properties:
        ficha_id: { type: integer }
        persona_id: { type: integer, nullable: true, description: Omitir para ámbitos sin permiso. }
        persona_reutilizada: { type: boolean }
        advertencias: { type: array, items: { type: string } }
    GrupoDetalle:
      type: object
      properties:
        grupo_id: { type: integer }
        ficha_id: { type: integer }
        lider_persona_id: { type: integer, readOnly: true, description: Derivado de ficha.persona_id, NO columna GC. }
        nombre: { type: string, nullable: true }
        cantidad_integrantes_aprox: { type: integer, nullable: true }
        version_ficha: { type: integer }
    PaginaPersonas:
      type: object
      properties:
        pagina: { type: integer }
        tamano: { type: integer }
        total: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/PersonaResumen' } }
    PaginaGrupos:
      type: object
      properties:
        pagina: { type: integer }
        total: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/GrupoDetalle' } }
    DuplicadoMinimizado:
      type: object
      properties:
        hay_coincidencia: { type: boolean }
        tipo: { type: string, enum: [NINGUNA, EXACTA, POSIBLE] }
        personas_visibles: { type: array, items: { $ref: '#/components/schemas/PersonaResumen' } }
        coincidencia_fuera_de_ambito: { type: boolean }
    UsuarioPublico:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre_display: { type: string }
        perfil: { type: string, enum: [DIGITADOR, ADMIN, REPORTES] }
        alcance_consulta: { type: string, enum: [GENERAL, PRESBITERIO] }
        presbiterio_ids: { type: array, items: { type: integer } }
        activo: { type: boolean }
    UsuarioPatch:
      type: object
      properties:
        nombre_display: { type: string }
        activo: { type: boolean }
        alcance_consulta: { type: string, enum: [GENERAL, PRESBITERIO] }
        presbiterio_ids: { type: array, items: { type: integer } }
    ReporteAvance:
      type: object
      properties:
        filas: { type: array, items: { type: object, additionalProperties: true } }
        fuente_ediciones: { type: string, description: auditoria_evento por actor. }
    ReporteCalidad:
      type: object
      properties:
        fichas_evaluadas: { type: integer }
        incompletas: { type: integer }
        posibles_duplicados: { type: integer }
        faltantes_por_campo: { type: object, additionalProperties: { type: integer } }
    PaginaAuditoria:
      type: object
      properties:
        pagina: { type: integer }
        total: { type: integer }
        items: { type: array, items: { type: object, additionalProperties: true } }
    RespuestaOperacion:
      type: object
      properties:
        ok: { type: boolean }
        request_id: { type: string }
    AuthMe:
      type: object
      description: 'Solo en sesión autorizada; token CSRF recuperable tras refresh; ámbito nacional por rol pendiente E2-D02.'
      properties:
        usuario_id: { type: integer }
        perfil: { type: string, enum: [DIGITADOR, ADMIN, REPORTES] }
        alcance_consulta: { type: string, enum: [GENERAL, PRESBITERIO] }
        presbiterio_id: { type: integer }
        sede_id: { type: integer, nullable: true }
        alcance_nacional: { type: boolean }
        csrf_token: { type: string, description: 'Solo sesión autenticada, nunca secreto localStorage.' }
        vence_inactividad_en: { type: string, format: date-time }
        vence_absoluta_en: { type: string, format: date-time }
    PresbiterioPublico:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string }
        nombre: { type: string }
    CatalogoValor:
      type: object
      properties:
        dominio: { type: string }
        codigo: { type: string }
        etiqueta: { type: string }
        orden: { type: integer }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        request_id: { type: string }
    Login:
      type: object
      required: [presbiterio_id, usuario, password]
      properties:
        presbiterio_id: { type: integer }
        usuario: { type: string }
        password: { type: string, format: password }
    Location:
      type: object
      required: [estado, capturada_en]
      properties:
        estado: { type: string, enum: [OK, DENEGADA, NO_DISPONIBLE, ERROR] }
        latitud: { type: number, minimum: -90, maximum: 90, nullable: true }
        longitud: { type: number, minimum: -180, maximum: 180, nullable: true }
        precision_m: { type: number, minimum: 0, nullable: true }
        capturada_en: { type: string, format: date-time }
    Sede:
      type: object
      properties:
        id: { type: integer }
        presbiterio_id: { type: integer }
        nombre_oficial: { type: string }
        ubicacion_referencia: { type: string, nullable: true }
    BusquedaSedes:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Sede' } }
        similares: { type: array, items: { $ref: '#/components/schemas/Sede' } }
        advertencia: { type: string, nullable: true, description: Similitud no bloquea un nombre legitimamente distinto. }
    NewSede:
      type: object
      required: [nombre_oficial]
      properties:
        nombre_oficial: { type: string, minLength: 2, maxLength: 200 }
        ubicacion_referencia: { type: string, nullable: true }
    PersonaInput:
      type: object
      description: "El número de ficha y los campos críticos son opcionales al guardar; solo contexto autenticado es obligatorio."
      properties:
        numero_ficha: { type: string, nullable: true }
        tipo_documento: { type: string, nullable: true, enum: [DNI, CE, OTRO] }
        tipo_documento_detalle: { type: string, nullable: true, description: 'Si OTRO, el subtipo es necesario para deduplicar exactamente.' }
        numero_documento: { type: string, nullable: true }
        nombres: { type: string, nullable: true }
        apellido_paterno: { type: string, nullable: true }
        apellido_materno: { type: string, nullable: true }
        fecha_nacimiento: { type: string, format: date, nullable: true }
        sexo_codigo: { type: string, nullable: true }
        estado_civil_codigo: { type: string, nullable: true }
        telefono: { type: string, nullable: true }
        correo: { type: string, format: email, nullable: true }
        facebook_usuario: { type: string, nullable: true }
        direccion: { type: string, nullable: true }
        ubigeo_dpto_codigo: { type: string, nullable: true }
        ubigeo_prov_codigo: { type: string, nullable: true }
        ubigeo_dist_codigo: { type: string, nullable: true }
        condicion_codigo: { type: string, nullable: true }
        fecha_condicion: { type: string, format: date, nullable: true }
        es_lider_gc_intencion: { type: boolean }
        fecha_papel: { type: string, format: date, nullable: true }
        responsable_papel: { type: string, nullable: true }
        observaciones: { type: string, nullable: true }
        conyuge: { type: object, additionalProperties: true, nullable: true }
        responsabilidades: { type: array, items: { type: object, additionalProperties: true } }
    GCInput:
      type: object
      properties:
        numero_ficha: { type: string, nullable: true }
        grupo_ya_existe: { type: boolean, nullable: true }
        nombre: { type: string, nullable: true }
        tipo_gc: { type: string, nullable: true }
        estado_gc: { type: string, nullable: true }
        fecha_inicio: { type: string, format: date, nullable: true }
        capacidad: { type: integer, minimum: 0, nullable: true }
        cantidad_integrantes_aprox: { type: integer, minimum: 0, nullable: true }
        direccion_lugar: { type: string, nullable: true }
        referencia: { type: string, nullable: true }
        es_matrimonios: { type: boolean, nullable: true }
        fecha_papel: { type: string, format: date, nullable: true }
        responsable_papel: { type: string, nullable: true }
        observaciones: { type: string, nullable: true }
    Criticidad:
      type: object
      required: [entidad, campo_codigo, es_critico]
      properties:
        entidad: { type: string, enum: [PERSONA, GC] }
        campo_codigo: { type: string }
        etiqueta: { type: string, readOnly: true }
        ruta_dato: { type: string, readOnly: true }
        desactivable: { type: boolean, readOnly: true }
        es_critico: { type: boolean }
    UsuarioInput:
      type: object
      required: [codigo, nombre_display, perfil]
      properties:
        codigo: { type: string }
        nombre_display: { type: string }
        perfil: { type: string, enum: [DIGITADOR, ADMIN, REPORTES] }
        alcance_consulta: { type: string, enum: [GENERAL, PRESBITERIO], default: PRESBITERIO }
        presbiterio_ids: { type: array, items: { type: integer } }
        activo: { type: boolean }
paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200': { description: 'Sesión iniciada, cookie HttpOnly, evento registrado; se requiere usuario tecleado, no listado público', content: { application/json: { schema: { $ref: '#/components/schemas/AuthMe' } } } }
        '401': { description: 'Credenciales inválidas', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'Límite de intentos', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/me:
    get:
      tags: [auth]
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: 'Usuario, ámbito y token CSRF válido recuperables tras recarga; sesión inactividad 45 min, absoluta 12 h (configurable).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMe' }
        '401': { description: 'No autenticado', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/logout:
    post:
      tags: [auth]
      security: [{ cookieAuth: [], csrf: [] }]
      responses:
        '204': { description: 'Sesión invalidada' }
  /auth/ubicacion:
    post:
      tags: [auth]
      security: [{ cookieAuth: [], csrf: [] }]
      description: 'Snapshot único por sesión, rechaza recaptura y acepta estados denegados sin impedir uso.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Location' }
      responses:
        '200': { description: 'Ubicación de sesión original o recién guardada', content: { application/json: { schema: { $ref: '#/components/schemas/Location' } } } }
        '409': { description: 'Ubicación ya capturada (se devuelve la primera)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /presbiterios:
    get:
      tags: [catalogos]
      security: []
      description: 'PÚBLICO: solo id, código y nombre de presbiterios activos para mostrar login; nunca listar usuarios.'
      responses:
        '200':
          description: 'Lista limitada de presbiterios activos'
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PresbiterioPublico' }
  /catalogos:
    get:
      tags: [catalogos]
      security: [{ cookieAuth: [] }]
      description: 'Valores de dominios autorizados según fichas; sin inventar ubigeo INEI.'
      parameters:
        - in: query
          name: dominio
          schema: { type: string }
      responses:
        '200':
          description: 'Lista vigente de valores de catálogos confirmados'
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogoValor' }
        '401': { description: 'No autenticado', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /sedes:
    get:
      tags: [catalogos]
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200': { description: 'Solo sedes del presbiterio autenticado', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Sede' } } } } }
    post:
      tags: [catalogos]
      security: [{ cookieAuth: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewSede' }
      responses:
        '201': { description: 'Sede creada y disponible', content: { application/json: { schema: { $ref: '#/components/schemas/BusquedaSedes' } } } }
        '409': { description: 'Duplicado normalizado', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /contexto/presbiterio:
    put:
      tags: [auth]
      security: [{ cookieAuth: [], csrf: [] }]
      description: 'SOLO ADMIN, cambio explícito de presbiterio activo nacional (E2-D02 pendiente); invalida sede anterior.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presbiterio_id]
              properties:
                presbiterio_id: { type: integer }
      responses:
        '200': { description: 'Contexto actualizado; sede se vuelve a seleccionar', content: { application/json: { schema: { $ref: '#/components/schemas/AuthMe' } } } }
        '403': { description: 'Solo ADMIN; digitador no cambia presbiterio', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'Presbiterio inactivo o inválido', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /contexto/sede:
    put:
      tags: [auth]
      security: [{ cookieAuth: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sede_id]
              properties:
                sede_id: { type: integer }
      responses:
        '200': { description: 'Sede contextual consistente', content: { application/json: { schema: { $ref: '#/components/schemas/AuthMe' } } } }
        '403': { description: 'Sede fuera de ámbito', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /personas/duplicados:
    get:
      tags: [personas]
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: tipo_documento
          schema: { type: string }
        - in: query
          name: tipo_documento_detalle
          schema: { type: string }
        - in: query
          name: numero_documento
          schema: { type: string }
      responses:
        '200': { description: 'Existencia de coincidencia minimizada: no revelar datos/ID globales ajenos, especialmente entre presbiterios', content: { application/json: { schema: { $ref: '#/components/schemas/DuplicadoMinimizado' } } } }
  /personas:
    get:
      tags: [personas]
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: presbiterio_id
          schema: { type: integer }
          description: Validar GENERAL/PRESBITERIO en backend.
        - in: query
          name: sede_id
          schema: { type: integer }
        - in: query
          name: digitador_id
          schema: { type: integer }
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
        - in: query
          name: incompleta
          schema: { type: boolean }
        - in: query
          name: posible_duplicado
          schema: { type: boolean }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: pagina
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: tamano
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        '200': { description: 'Consultas filtradas por permiso GENERAL/PRESBITERIO; edición digitador solo propia', content: { application/json: { schema: { $ref: '#/components/schemas/PaginaPersonas' } } } }
    post:
      tags: [personas]
      security: [{ cookieAuth: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaInput' }
      responses:
        '201': { description: 'Persona y ficha guardadas; muestra IDs persistidos', content: { application/json: { schema: { $ref: '#/components/schemas/PersonaGuardada' } } } }
        '409': { description: 'Conflicto de identidad o idempotencia', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'Datos estructuralmente inválidos', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /personas/{id}:
    get:
      tags: [personas]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PersonId'
      responses:
        '200': { description: 'Persona y fichas visibles autorizadas', content: { application/json: { schema: { $ref: '#/components/schemas/PersonaDetalle' } } } }
        '403': { description: 'Fuera de ámbito', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      tags: [personas]
      security: [{ cookieAuth: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/PersonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PersonaInput'
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, minimum: 1 }
      responses:
        '200': { description: 'Modificación auditada, autor original conservado', content: { application/json: { schema: { $ref: '#/components/schemas/PersonaDetalle' } } } }
        '403': { description: 'Edición no autorizada', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Versión conflictiva', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /personas/{id}/fichas:
    post:
      tags: [personas]
      description: 'Vincula ficha nueva a Persona existente; nunca duplica identidad documental.'
      security: [{ cookieAuth: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonaInput' }
      responses:
        '201': { description: 'Ficha fuente adicional creada', content: { application/json: { schema: { $ref: '#/components/schemas/FichaDetalle' } } } }
        '403': { description: 'Fuera de ámbito', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /personas/{id}/grupos:
    post:
      tags: [gc]
      security: [{ cookieAuth: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/PersonId'
        - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GCInput' }
      responses:
        '201': { description: 'GC vinculado a ficha tipo GC; líder = ficha.persona_id, sin segundo lider_persona_id ni integrantes nominales', content: { application/json: { schema: { $ref: '#/components/schemas/GrupoDetalle' } } } }
        '409': { description: 'Conflicto: grupo existente o nuevo líder', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /grupos:
    get:
      tags: [gc]
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: presbiterio_id
          schema: { type: integer }
        - in: query
          name: sede_id
          schema: { type: integer }
        - in: query
          name: pagina
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: tamano
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        '200': { description: 'Lista paginada GC autorizados', content: { application/json: { schema: { $ref: '#/components/schemas/PaginaGrupos' } } } }
  /grupos/{id}:
    get:
      tags: [gc]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200': { description: 'GC consultado por ámbito; líder derivado de ficha', content: { application/json: { schema: { $ref: '#/components/schemas/GrupoDetalle' } } } }
        '403': { description: 'Sin permiso de consulta', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      tags: [gc]
      security: [{ cookieAuth: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/PersonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/GCInput'
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer }
      responses:
        '200': { description: 'Actualización y auditoría sin sustitución de líder', content: { application/json: { schema: { $ref: '#/components/schemas/GrupoDetalle' } } } }
  /admin/usuarios:
    get:
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: 'ADMIN lista usuarios', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UsuarioPublico' } } } } }
        '403': { description: 'Sin permiso', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [admin]
      security: [{ cookieAuth: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioInput' }
      responses:
        '201': { description: 'Cuenta creada / secretos fuera de respuesta', content: { application/json: { schema: { $ref: '#/components/schemas/UsuarioPublico' } } } }
        '403': { description: 'Sin permiso', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/usuarios/{id}/reiniciar-acceso:
    post:
      tags: [admin]
      security: [{ cookieAuth: [], csrf: [] }]
      description: Reiniciar acceso y revocar sesiones; provisión de contraseña por canal seguro separado, nunca en respuesta.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200': { description: 'Acceso reiniciado y sesiones revocadas', content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaOperacion' } } } }
        '403': { description: 'Solo ADMIN', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/usuarios/{id}:
    patch:
      tags: [admin]
      security: [{ cookieAuth: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioPatch' }
      responses:
        '200': { description: 'Cuenta activada/desactivada / permisos ajustados', content: { application/json: { schema: { $ref: '#/components/schemas/UsuarioPublico' } } } }
        '403': { description: 'No autorizado', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /config/campos-criticos:
    get:
      tags: [admin]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: 'Configuración de calidad vigente', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Criticidad' } } } } }
    put:
      tags: [admin]
      security: [{ cookieAuth: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Criticidad' }
      responses:
        '200': { description: 'Parámetros auditados; desactivable=false nunca se desactiva; informes se recalculan al consultar', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Criticidad' } } } } }
        '422': { description: 'Intento de desactivar relación estructural obligatoria', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Solo ADMIN', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /reportes/avance:
    get:
      tags: [reportes]
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: presbiterio_id
          schema: { type: integer }
          description: Validar GENERAL/PRESBITERIO en backend.
        - in: query
          name: sede_id
          schema: { type: integer }
        - in: query
          name: digitador_id
          schema: { type: integer }
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
        - in: query
          name: incompleta
          schema: { type: boolean }
        - in: query
          name: posible_duplicado
          schema: { type: boolean }
      responses:
        '200': { description: 'Presbiterio, sede, último guardado, conteos, productividad', content: { application/json: { schema: { $ref: '#/components/schemas/ReporteAvance' } } } }
  /reportes/calidad:
    get:
      tags: [reportes]
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: presbiterio_id
          schema: { type: integer }
          description: Validar GENERAL/PRESBITERIO en backend.
        - in: query
          name: sede_id
          schema: { type: integer }
        - in: query
          name: digitador_id
          schema: { type: integer }
        - in: query
          name: desde
          schema: { type: string, format: date }
        - in: query
          name: hasta
          schema: { type: string, format: date }
        - in: query
          name: incompleta
          schema: { type: boolean }
        - in: query
          name: posible_duplicado
          schema: { type: boolean }
      responses:
        '200': { description: 'Calidad calculada usando campos críticos vigentes, sin marca_calidad persistida; no verifica fidelidad al papel', content: { application/json: { schema: { $ref: '#/components/schemas/ReporteCalidad' } } } }
  /auditoria:
    get:
      tags: [auditoria]
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: 'Solo ADMIN; acciones paginadas y control de GPS', content: { application/json: { schema: { $ref: '#/components/schemas/PaginaAuditoria' } } } }
        '403': { description: 'Sin permiso', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }


  /fichas/{id}:
    get:
      tags: [personas]
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200': { description: 'Ficha fuente según permisos', content: { application/json: { schema: { $ref: '#/components/schemas/FichaDetalle' } } } }
        '403': { description: 'No autorizado', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      tags: [personas]
      security: [{ cookieAuth: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/PersonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, datos_fuente]
              properties:
                version: { type: integer, minimum: 1 }
                datos_fuente: { type: object, additionalProperties: true }
                observaciones: { type: string, nullable: true }
      responses:
        '200': { description: 'Ficha fuente editada con auditoría, creador intacto', content: { application/json: { schema: { $ref: '#/components/schemas/FichaDetalle' } } } }
        '403': { description: 'Ficha ajena', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Versión en conflicto', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
